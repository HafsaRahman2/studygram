# Configuration used only by the test suite (activated by @ActiveProfiles("test")).
#
# The point of this file is that `./mvnw test` works on a fresh clone with
# nothing installed and nothing configured. A test suite that first needs you to
# start PostgreSQL and export three environment variables is a test suite that
# stops being run.

# In-memory database, created empty at the start of every run and thrown away
# afterwards, so tests can never see each other's leftovers.
spring.datasource.url=jdbc:h2:mem:studygram-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Quiet. Test output should show test results, not thousands of SQL statements.
spring.jpa.show-sql=false

# A fixed, obviously-fake signing secret. Tests must be deterministic, and this
# value never touches a real deployment.
studygram.jwt.secret=dGVzdC1vbmx5LXNlY3JldC1ub3QtdXNlZC1hbnl3aGVyZS1yZWFsLTEyMzQ1Ng==
studygram.jwt.expiry-minutes=60

# The AI assistant is never called in tests; no key needed.
groq.api.key=
groq.api.model=test-model

studygram.cors.allowed-origins=http://localhost:5173
