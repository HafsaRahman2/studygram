spring.application.name=studygram-backend

# ---------------------------------------------------------------------------
# CONFIGURATION VIA ENVIRONMENT VARIABLES
#
# The ${VAR_NAME:default} syntax means:
#   "use the environment variable VAR_NAME, or fall back to 'default'"
#
# This keeps secrets OUT of the source code. Anyone cloning this repo gets
# working local defaults, and real credentials are supplied by the environment.
# See .env.example for the variables you can set.
# ---------------------------------------------------------------------------

# Database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studygram}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA settings
# ddl-auto=update lets Hibernate create/alter tables to match our @Entity classes.
# Convenient in development; a real production app would use migrations (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}

# ---------------------------------------------------------------------------
# AUTHENTICATION
#
# Spring Security is fully enabled; see config/SecurityConfig.java for which
# endpoints are public and which require a token.
#
# The signing secret must be at least 32 bytes. Anyone holding it can forge a
# token for any account, so the development default below is for localhost only
# and the application logs a loud warning when it is in use.
#
# Generate a real one:  openssl rand -base64 32
# Then set:             STUDYGRAM_JWT_SECRET=<the output>
# ---------------------------------------------------------------------------
# Spring Security assumes there might be a form login and invents a random
# password for a default in-memory user, printing it at startup. This app
# authenticates with tokens and has no such user, so that auto-configuration is
# switched off - otherwise every startup logs an alarming (and meaningless)
# "Using generated security password" line.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

studygram.jwt.secret=${STUDYGRAM_JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-0123456789}

# How long a token stays valid, in minutes. Default is 7 days.
studygram.jwt.expiry-minutes=${STUDYGRAM_JWT_EXPIRY_MINUTES:10080}

# Groq AI API key, for the AI Study Assistant.
# Get a free one at https://console.groq.com/keys and export it:
#   export GROQ_API_KEY=gsk_your_key_here
# If it is not set, the AI endpoints return a friendly message instead of failing.
groq.api.key=${GROQ_API_KEY:}
groq.api.model=${GROQ_MODEL:llama-3.1-8b-instant}

# Which frontend origins are allowed to call this API (see config/CorsConfig.java)
studygram.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
